services:
  webhook:
    build:
      context: .
      dockerfile: agent/webhook/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - ../.env
    depends_on:
      - agent
    restart: unless-stopped

  agent:
    image: llm-cicd-agent:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env
    volumes:
      # Root-equivalent host access — needed so manager.py can spin up
      # per-push sandbox containers via docker-py. See "Control-Plane
      # Privilege (Known Risk)" in agent/sandbox/CLAUDE.md before treating
      # this as hardened; a scoped docker-socket-proxy is the mitigation
      # if this matters for your deployment.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ${OLLAMA_MODELS_DIR:-ollama-models}:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-models:
