services:
  webhook:
    build:
      context: .
      dockerfile: agent/webhook/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - ../.env
    depends_on:
      - agent
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ${OLLAMA_MODELS_DIR:-ollama-models}:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-models:
