# Model balancing strategy — see CLAUDE.md for escalation rules
#
# Priority: DeepSeek (free) → Haiku → Sonnet → Opus (last resort)
# NEVER call Opus without two prior failed attempts.

models:
  deepseek_coder:
    provider: ollama
    model_id: deepseek-coder:6.7b
    host: ${OLLAMA_HOST:-http://localhost:11434}
    priority: 1  # Always try first
    cost: free

  haiku:
    provider: anthropic
    model_id: claude-haiku-4-5-20251001
    priority: 2
    cost: low

  sonnet:
    provider: anthropic
    model_id: claude-sonnet-4-6
    priority: 3
    cost: medium

  opus:
    provider: anthropic
    model_id: claude-opus-4-6
    priority: 4  # LAST RESORT ONLY
    cost: high

# Task-to-model mapping.
#
# IMPORTANT — what these fields actually control: `primary`/`fallback`/
# `last_resort` are an ELIGIBILITY gate, not a model router. The escalation
# ORDER (DeepSeek -> Haiku -> Sonnet -> Opus) is hardcoded in
# agent/llm/analyzer.py::analyze_finding() to match the fixed cascade
# described in the root CLAUDE.md; analyzer.py only reads whether
# `task.fallback`/`task.last_resort` is None to decide whether a given task
# is AUTHORIZED to escalate that far at all (see the single_file_fix comment
# below). It does not read the model NAMES here to pick which client to
# call — renaming e.g. single_file_fix's `fallback` from `sonnet` to `haiku`
# would not reroute anything; the hardcoded chain would still call Sonnet.
# If per-task model routing (not just eligibility) becomes a real
# requirement, analyzer.py needs to actually look up clients by these names
# instead of by fixed attribute.
tasks:
  error_classification:
    primary: deepseek_coder
    fallback: haiku
    max_tokens_in: 500
    max_tokens_out: 100

  single_file_fix:
    primary: deepseek_coder
    fallback: sonnet
    last_resort: opus  # matches root CLAUDE.md's escalation flow — Opus is
                        # reachable as absolute last resort (3rd attempt
                        # only, gated by escalation.opus_min_attempt below),
                        # not just for the (currently unimplemented)
                        # multi_file_fix task.
    max_tokens_in: 3000
    max_tokens_out: 1000

  # Scores a candidate fix's confidence via confidence_eval.j2. Always run by
  # Haiku (see root CLAUDE.md's "confidence scoring" line under Haiku),
  # independent of which model generated the fix being scored — a fix
  # generator grading its own homework is not a meaningful confidence signal,
  # and fix_single_file.j2's "no explanation" instruction means the
  # generating model never emits a usable score inline anyway.
  confidence_eval:
    primary: haiku
    max_tokens_in: 2000
    max_tokens_out: 150

  multi_file_fix:
    primary: deepseek_coder
    fallback: sonnet
    last_resort: opus
    max_tokens_in: 8000
    max_tokens_out: 2000

  pr_body:
    primary: haiku
    max_tokens_in: 1000
    max_tokens_out: 500

  security_analysis:
    primary: deepseek_coder
    fallback: sonnet
    max_tokens_in: 2000
    max_tokens_out: 800

# Escalation
escalation:
  confidence_threshold: 0.5  # Below this → escalate
  max_attempts: 3            # Max attempts before giving up
  opus_min_attempt: 3        # Opus only on 3rd attempt
